{% extends "base.html" %}
{% block title %}लॉगिन - SHORYA 360{% endblock %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200 w-full max-w-md">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-red-600 tracking-wider">SHORYA 360</h1>
            <p class="text-xs text-slate-500 font-semibold mt-1">पोलीस संशयित प्रोफाइल व्यवस्थापन प्रणाली</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4 text-xs">
            
            <!-- 1. Officer Name Field -->
            <div>
                <label class="block font-bold text-slate-700 mb-1">अधिकाऱ्याचे नाव (Officer Name) <span class="text-red-500">*</span></label>
                <input type="text" name="name" required placeholder="उदा. Ramesh Pawar / System Administrator"
                       class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-600 outline-none text-xs">
            </div>

            <!-- 2. Username Field -->
            <div>
                <label class="block font-bold text-slate-700 mb-1">युझरनेम (Username) <span class="text-red-500">*</span></label>
                <input type="text" name="username" required placeholder="उदा. admin / officer123"
                       class="w-full border border-slate-300 rounded px-3 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-600 outline-none text-xs">
            </div>

            <!-- 3. Password Field with Show/Hide Eye Toggle -->
            <div>
                <label class="block font-bold text-slate-700 mb-1">पासवर्ड (Password) <span class="text-red-500">*</span></label>
                <div class="relative">
                    <input type="password" id="passwordInput" name="password" required placeholder="••••••••"
                           class="w-full border border-slate-300 rounded pl-3 pr-10 py-2 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-600 outline-none text-xs">
                    
                    <button type="button" onclick="togglePasswordVisibility()" 
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-700 focus:outline-none">
                        <!-- Eye Icon (Show) -->
                        <svg id="eyeOpenIcon" class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <!-- Eye Crossed Icon (Hide) -->
                        <svg id="eyeClosedIcon" class="h-4 w-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded text-xs tracking-wider uppercase transition shadow-sm mt-2">
                प्रवेश करा (Login)
            </button>
        </form>

    </div>
</div>

<script>
function togglePasswordVisibility() {
    const passwordInput = document.getElementById('passwordInput');
    const eyeOpen = document.getElementById('eyeOpenIcon');
    const eyeClosed = document.getElementById('eyeClosedIcon');

    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeClosed.classList.remove('hidden');
    } else {
        passwordInput.type = 'password';
        eyeOpen.classList.remove('hidden');
        eyeClosed.classList.add('hidden');
    }
}
</script>
{% endblock %}
